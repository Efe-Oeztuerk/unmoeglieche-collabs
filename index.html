<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unmögliche Kollabs</title>
<meta name="description" content="Zufällige Marke trifft zufälliges Produkt. Die KI entwirft das Kollab-Produkt als realistisches Foto. Allein im Studio oder als Partyspiel mit Freunden.">
<meta name="theme-color" content="#09090B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <a class="brandmark" href="#studio" style="color:inherit;text-decoration:none"><i aria-hidden="true"></i><span class="full">Unmögliche Kollabs</span></a>
    <nav class="tabs" aria-label="Bereiche">
      <a href="#studio">Studio</a>
      <a href="#spielen">Spielen</a>
      <a href="#profil">Profil</a>
    </nav>
  </div>
</header>

<!-- Studio (allein) -->
<div id="view-studio" class="view">
  <main class="wrap grid">
    <section class="panel draw" aria-label="Ziehung">
      <div class="slot">
        <span class="label"><span>Marke</span><span>Antippen = neu</span></span>
        <button class="slot-word" id="brand" type="button">Ferrari</button>
      </div>
      <div class="cross-row" aria-hidden="true"><span>×</span><hr></div>
      <div class="slot">
        <span class="label"><span>Produkt</span><span>Antippen = neu</span></span>
        <button class="slot-word" id="product" type="button">Kinderwagen</button>
      </div>
      <div class="actions">
        <button class="btn primary" id="designBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
          Entwerfen
        </button>
        <button class="btn" id="rollBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/></svg>
          Neu ziehen
        </button>
      </div>
      <details class="own">
        <summary>Eigene Kombination eingeben</summary>
        <form class="own-form" id="ownForm">
          <input class="field" id="ownBrand" placeholder="Marke, z. B. Gucci" maxlength="40" autocomplete="off">
          <input class="field" id="ownProduct" placeholder="Produkt, z. B. Mülltonne" maxlength="40" autocomplete="off">
          <button class="btn small" type="submit">Übernehmen</button>
        </form>
      </details>
    </section>
    <section class="studio" id="soloStudio" aria-label="Studio"></section>
    <section class="panel spec" id="soloSpec" aria-label="Datenblatt"></section>
  </main>

  <section class="wrap archive" id="archiv" aria-label="Archiv">
    <div class="archive-head">
      <h3>Archiv</h3>
      <span class="count"><span id="archiveCount"></span> <button class="linkish" id="clearBtn" type="button" hidden>Archiv leeren</button></span>
    </div>
    <div class="sheet" id="sheet"></div>
    <p class="none" id="noneNote">Deine Entwürfe und gemerkten Spiel-Produkte landen hier, nur auf diesem Gerät gespeichert.</p>
  </section>
</div>

<!-- Spielen -->
<div id="view-spielen" class="view" hidden>
  <div id="gameRoot"></div>
</div>

<!-- Profil -->
<div id="view-profil" class="view" hidden>
  <div id="profileRoot"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="/js/core.js"></script>
<script src="/js/solo.js"></script>
<script src="/js/game.js"></script>
<script src="/js/account.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
